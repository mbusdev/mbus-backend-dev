version: "3.8"

services:
  backend:
    build: .
    container_name: mbus-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      INDOOR_MONGO_URI: mongodb://172.31.96.1:27017
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    
  redis:
    image: redis:7
    container_name: mbus-redis
    restart: unless-stopped

    ports:
      - "6379:6379"