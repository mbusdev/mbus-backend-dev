<html>
<head>
  <title>Walking Path Viewer</title>
  <!-- <link rel="stylesheet" href="./style.css" /> -->
  <script>
    (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
      key: "@@@KEY@@@",
      v: "weekly",
      // Use the 'v' parameter to indicate the version to use (weekly, beta, alpha, etc.).
      // Add other bootstrap parameters as needed, using camel case.
    });
  </script>
  <style>
    #map {
      flex: 1
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; height: 100%">
    <div style="display: flex; flex-direction: row">
      <p id="instr">Left click to set start, right click to set end</p>
      <!-- <button onclick="loadPath()">Load Path</button> -->
    </div>
    <div id="map"></div>
  </div>
  <script>
    let start = null;
    let end = null;
    let markers = [];
    let polylines = [];
    let detailedPath = [];
    let nodes = [];
    <!-- let loadNewPath = false; -->

    async function initMap() {
      console.log("hi");
      const [{ Map, Polyline }, { AdvancedMarkerElement, PinElement }] = await Promise.all([
        google.maps.importLibrary("maps"), google.maps.importLibrary("marker")
      ]);
      const map = new google.maps.Map(
        document.getElementById("map"),
        { center: { lat: 42.2830, lng: -83.7350 }, zoom: 14, mapId: "DEMO_MAP_ID" }
      );

      const updateMap = () => {
        markers.map((m) => {m.setMap(null);})
        markers = [];
        polylines.map((p) => {p.setMap(null);})
        polylines = [];
        if (nodes.length > 0) {
          const locations = nodes.map((x) => {return {lat: x.lat, lng: x.lon}});
          for (const l of locations) {
            markers.push(new AdvancedMarkerElement({
              map,
              position: l,
              content: new PinElement({ scale: 0.66, glyphColor: "magenta", borderColor: "magenta", background: "magenta" }),
            }));
          }
          polylines.push(new Polyline({map, path: locations, strokeColor: "magenta", strokeWeight: 5}));
        }
        if (detailedPath.length > 0) {
          const locations = detailedPath.map((x) => {return {lat: x.lat, lng: x.lon}});
          for (const l of locations) {
            markers.push(new AdvancedMarkerElement({
              map,
              position: l,
              content: new PinElement({ scale: 0.33, glyphColor: "orange", borderColor: "orange", background: "orange" }),
            }));
          }
          polylines.push(new Polyline({map, path: locations, strokeColor: "orange"}));
        }
        if (start) {
          markers.push(new AdvancedMarkerElement({
            map, position: start, title: "start"
          }));
        }
        if (end) {
          markers.push(new AdvancedMarkerElement({
            map,
            position: end,
            title: "end",
            content: new PinElement({ glyphColor: "darkgreen", borderColor: "green", background: "green" }),
          }));
        }
      };

      const update = () => {
        if (start && end) {
          console.log(start.lat());
          const req = new Request(`../mbus/api/v3/plan-journey?originLat=${start.lat()}&originLon=${start.lng()}&destLat=${end.lat()}&destLon=${end.lng()}`);
          fetch(req).then((res) => {
            res.json().then((body) => {
              console.log(body);
              const leg = body.journeys[0].legs[0];
              console.log(leg);
              detailedPath = leg.path_coords;
              nodes = leg.node_coords
              updateMap();
            });
          });
        } else {
          updateMap();
        }
      };
  
      map.addListener("click", (e) => {
        console.log(`click: ${JSON.stringify(e)}`);
        start = e.latLng;
        update();
      });

      map.addListener("contextmenu", (e) => {
        console.log(`contextmenu: ${JSON.stringify(e)}`);
        end = e.latLng;
        update();
      });
    }

    initMap();
    
  </script>
</body>
</html>
